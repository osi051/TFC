<style>
:root{--bg:#faf9f6;--c:#fff;--t:#1d1612;--m:#85796f;--p:#ff2d1a;--b:#ece5dc;--ok:#1d8a4a;--bl:#2f7de1;--yl:#f5b301}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121010;--c:#1d1917;--t:#f4ece6;--m:#a39489;--b:#2c2522}}
:root[data-theme="dark"]{--bg:#121010;--c:#1d1917;--t:#f4ece6;--m:#a39489;--b:#2c2522}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 'Segoe UI',system-ui,-apple-system,Roboto,sans-serif}
#w{max-width:640px;margin:0 auto;padding:12px 12px 130px}
button,input,select{font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:14px;padding:11px 14px}
input,select{width:100%;margin:6px 0}
input[type=radio]{width:auto;margin:0}
button{cursor:pointer;transition:transform .12s,opacity .12s}
button:active{transform:scale(.97)}
.pb{background:linear-gradient(135deg,#ff2d1a,#ff5a2c);color:#fff;border:0;font-weight:700;padding:14px 18px;border-radius:16px;box-shadow:0 8px 20px #ff2d1a44;width:100%}
.fx{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;padding:16px;border-radius:22px;box-shadow:0 14px 34px #ff2d1a66;z-index:3}
.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cd{background:var(--c);border:1px solid var(--b);border-radius:20px;padding:14px;margin:10px 0;box-shadow:0 6px 20px #1d16120d;position:relative}
.g .cd{margin:0;border:0;border-radius:24px;padding-bottom:14px;animation:up .35s both}
.off{opacity:.5}
.em{font-size:44px}
.im{width:100%;height:112px;object-fit:cover;border-radius:14px}
.g .cd .im{margin:-14px -14px 10px;width:calc(100% + 28px);border-radius:24px 24px 0 0}
.g .cd .em{margin:-14px -14px 10px;padding:20px 0;text-align:center;font-size:46px;background:color-mix(in srgb,var(--p) 12%,var(--c));border-radius:24px 24px 0 0}
.bg{height:180px}.rc{object-fit:contain;height:auto;max-height:300px}
.th{width:46px;height:46px;object-fit:cover;border-radius:10px;vertical-align:middle;margin-right:8px}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0}
.nv{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:10px 0}
.n{background:var(--c);border:1px solid var(--b);border-left:5px solid var(--p);border-radius:16px;padding:12px;margin:10px 0}
.ok{border:2px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--c))}
.bad{border:2px solid var(--p)}
.yl{border:2px solid var(--yl);background:color-mix(in srgb,var(--yl) 10%,var(--c))}
.bl{border:2px solid var(--bl);background:color-mix(in srgb,var(--bl) 10%,var(--c))}
.nw{border:2px solid #ff9f1a;animation:pl 1.6s infinite}
.md{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:10}
.bx{background:var(--bg);width:100%;max-width:640px;border-radius:28px 28px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:sl .22s}
.on{background:var(--p);color:#fff;border-color:var(--p)}
small{color:var(--m)}
h3{font-size:20px;margin:14px 0 8px}

/* Hero & Banners */
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;border-radius:26px;padding:22px;margin-bottom:14px;color:#fff;background:linear-gradient(135deg,#1d1612 0%,#3b1a12 55%,#ff2d1a 135%);box-shadow:0 12px 30px #1d161233}
.hero::after{content:'';position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:#ffd50028}
.hero h1{margin:0;font-size:32px;letter-spacing:4px}.hero small{color:#ffd9a0;font-size:14px}
img.lg{width:68px;height:68px;border-radius:18px;box-shadow:0 4px 14px #0006}
#sl{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;scrollbar-width:none;margin-bottom:14px}
.bn{flex:0 0 100%;scroll-snap-align:start;height:172px;border-radius:26px;background:linear-gradient(135deg,#ff2d1a,#ff8a3d) center/cover;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;text-shadow:0 1px 6px #0009}
.bn b{font-size:23px}.bn small{color:#fff;font-weight:700;margin-top:4px}

/* Search & Categories */
.srch{position:relative;margin:8px 0 12px}
.srch input{padding-left:40px;border-radius:18px;background:var(--c);box-shadow:0 4px 14px #0000000a}
.srch span{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.6}
.pr{font-weight:800;font-size:17px;color:var(--p)}
.rib{position:absolute;top:10px;left:10px;background:#ffd500;color:#3a2600;font-size:12px;font-weight:800;padding:3px 10px;border-radius:20px;z-index:1}
.qa{position:absolute;right:10px;bottom:10px;width:40px;height:40px;padding:0;border:0;border-radius:50%;background:var(--p);color:#fff;font-size:25px;line-height:1;box-shadow:0 6px 14px #ff2d1a55}
.tl{min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;background:linear-gradient(150deg,#ff2d1a,#d91708);box-shadow:0 10px 24px #ff2d1a38}
.tl small{color:#ffd9cf}.tl b{font-size:17px}.g .cd.tl .em{font-size:48px;background:none;margin:0;padding:0}

/* Bottom Nav */
.nb{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:440px;margin:0 auto;display:flex;padding:6px;gap:4px;border:1px solid var(--b);border-radius:30px;background:color-mix(in srgb,var(--c) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 34px #1d16122e;z-index:4}
.nb button{position:relative;flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:22px;font-size:11px;font-weight:700;color:var(--m)}
.nb svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nb .on{background:color-mix(in srgb,var(--p) 15%,transparent);color:var(--p)}
.bd{position:absolute;top:2px;left:56%;background:var(--p);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px}
.dt{width:9px;height:9px;padding:0;left:58%;top:4px}

/* Courier & Admin extras */
.nak{background:color-mix(in srgb,var(--bg) 65%,var(--c));border:1px dashed var(--b);border-radius:14px;padding:12px;margin:10px 0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}
.items{border-top:1px dashed var(--b);border-bottom:1px dashed var(--b);margin:8px 0;padding:6px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.b-map{background:var(--bl);color:#fff;border:0;font-weight:700;width:100%}
.b-ok{background:var(--ok);color:#fff;border:0;font-weight:700;width:100%;margin-top:8px}
.b-call{display:flex;align-items:center;justify-content:center;text-decoration:none;background:var(--c);color:var(--t);border:1px solid var(--b);border-radius:14px;padding:11px;font-weight:700}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700}
.bg-free{background:#ff9f1a22;color:#d97706}
.bg-mine{background:#2f7de122;color:var(--bl)}
.bg-ok{background:#1d8a4a22;color:var(--ok)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:12px;text-align:center}
.stat b{font-size:20px;color:var(--p);display:block}
.bt{display:block;background:var(--c);border:1px solid var(--b);border-radius:16px;padding:16px;margin:10px 0;color:var(--t);text-decoration:none;font-weight:700}
.ins{display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;color:#1d1612;background:linear-gradient(135deg,#fff7c2,#ffe566)}
.ins small{color:#5c4a00}
.ts{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1d1612;color:#fff;padding:10px 18px;border-radius:20px;z-index:99;max-width:90%;text-align:center;font-size:14px;box-shadow:0 8px 24px #0004}

/* Splash */
#sp{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 35%,#fff3a8,#ffd500 60%,#ffb800);transition:opacity .45s}
#sp.hd{opacity:0;pointer-events:none}
#sp img{width:92px;height:92px;border-radius:24px;box-shadow:0 12px 30px #0003;animation:bnc 1.2s ease-in-out infinite}
#sp .br{width:150px;height:8px;border-radius:8px;background:#0002;overflow:hidden}
#sp .br i{display:block;height:100%;width:40%;background:#ff2d1a;border-radius:8px;animation:ldb 1.1s ease-in-out infinite}
@keyframes bnc{50%{transform:translateY(-8px)}}
@keyframes ldb{0%{margin-left:-40%}100%{margin-left:100%}}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes sl{from{transform:translateY(100%)}}
@keyframes pl{50%{box-shadow:0 0 0 6px #ff9f1a44}}
</style>
</head>

function openRoute(addr){
 const dest = encodeURIComponent((addr||'').trim());
 if(!dest) return alert('Суроға нест');
 T('📍 Ҷойгиршавии шумо муайян мешавад...');
 if('geolocation' in navigator){
  navigator.geolocation.getCurrentPosition(
   pos => {
    const orig = pos.coords.latitude.toFixed(6)+','+pos.coords.longitude.toFixed(6);
    window.open(`https://www.google.com/maps/dir/?api=1&origin=${orig}&destination=${dest}&travelmode=driving`, '_blank');
   },
   () => window.open(`https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=driving`, '_blank'),
   {enableHighAccuracy:true, timeout:5000}
  );
 } else {
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=driving`, '_blank');
 }
}
